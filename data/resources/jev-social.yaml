name: Jev Social
repo: https://github.com/socai-io/jev-social
tagline: Browser-grounded social research with Jev and the local socai CLI
description: >-
  An OpenCode-compatible Agent Skill that routes an Instagram, TikTok, or
  LinkedIn research goal through Jev, runs read-only searches with the user's
  local socai CLI and existing browser session, and returns source-linked
  evidence plus a Markdown report. Requires Node 20+, an OpenRouter key with
  Jev access, a supported socai CLI, and a signed-in browser when required by
  the platform.
scope:
  - project
tags:
  - agent-skill
  - social-research
  - browser-automation
  - jev
installation: >-
  npx skills add
  https://github.com/socai-io/jev-social/tree/v0.1.5/skills/jev-social
  --agent opencode --yes
